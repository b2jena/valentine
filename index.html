<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aradhana ❤️</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Stranger Things floating particles -->
    <div class="particles" id="particles"></div>
    <!-- Floating emojis — flowers, chocolates, food, hearts -->
    <div class="floating-emojis" id="floatingEmojis"></div>
    <!-- Christmas lights wire -->
    <div class="christmas-lights" id="christmasLights"></div>

    <div class="container">
        <div class="game-screen" id="gameScreen">
            <div class="lights"></div>
            <h1 class="title" id="title">Loading...</h1>
            <div class="content" id="content"></div>
            <div class="choices" id="choices"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
